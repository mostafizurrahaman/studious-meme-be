name: Deploy Malamal APIs to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-malamal-apis
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js with npm caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. Install dependencies (clean install from lock file)
      - name: Install dependencies
        run: npm ci

      # 4. Type check
      - name: Type Check
        run: npm run type-check

      # 5. Run tests
      - name: Run Tests
        run: npm test

      # 6. Build
      - name: Build
        run: npm run build

      # 7. Deploy to VPS over SSH
      - name: Deploy over SSH
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          
          script: |
            set -euo pipefail

            echo "==> Variables declaration"

            APP_DIR="/var/www/MalaMal_APIs"
            APP_NAME="malamal-apis"

            echo "==> Checking required system packages"

            if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y git curl
            fi

            echo "==> Checking Node.js"

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not installed. Installing Node.js 24..."

              curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
              sudo apt install -y nodejs
            fi

            echo "Node version: $(node -v)"
            echo "NPM version: $(npm -v)"

            echo "==> Checking PM2"

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2@latest
            fi

            echo "PM2 version: $(pm2 -v)"

            echo "==> Preparing app directory"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR"

            echo "==> Updating source code"

            if [ ! -d ".git" ]; then
              git clone -b main "${{ secrets.REPO_URL }}" .
            else
              git remote set-url origin "${{ secrets.REPO_URL }}"
              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi

            echo "==> Creating .env"

            cat <<'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "==> Installing dependencies"

            npm ci

            echo "==> Building Backend app"

            npm run build

            echo "==> Starting/Reloading PM2"

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 reload "$APP_NAME"
            else
              pm2 start dist/server.js --name "$APP_NAME"
            fi

            pm2 save

            echo "==> Deployment successful!"

            pm2 status
