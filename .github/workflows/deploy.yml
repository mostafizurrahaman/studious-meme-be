name: Deploy Malamal APIs to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-malamal-apis
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies on runner
        run: npm ci

      # 4. Run tests and build check
      - name: Run Tests and Build Check
        run: |
          npm test
          npm run build

      # 5. Deploy to VPS
      - name: Deploy over SSH
        if: success()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -euo pipefail

            echo "==> Variables declaration"

            APP_DIR="/var/www/MalaMal_APIs"
            APP_NAME="malamal-apis"

            echo "==> Updating system packages"

            sudo apt update -y
            sudo apt install -y git curl

            echo "==> Checking Node.js"

            if ! command -v node >/dev/null 2>&1; then
              echo "Node.js is not installed."
              exit 1
            fi

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "==> Checking/Installing PM2"

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "==> Preparing app directory"

            sudo mkdir -p "$APP_DIR"
            sudo chown -R "$USER:$USER" "$APP_DIR"

            cd "$APP_DIR" || exit 1

            echo "==> Updating source code"

            if [ ! -d ".git" ]; then
              git clone -b main "${{ secrets.REPO_URL }}" .
            else
              if git remote get-url origin >/dev/null 2>&1; then
                git remote set-url origin "${{ secrets.REPO_URL }}"
              else
                git remote add origin "${{ secrets.REPO_URL }}"
              fi

              git fetch origin main
              git reset --hard origin/main
              git clean -fd
            fi

            echo "==> Creating .env file"

            cat <<EOF > .env
            ${{ secrets.ENV_FILE }}
            EOF

            echo "==> Installing dependencies"

            npm ci

            echo "==> Building Backend app"

            npm run build

            echo "==> Starting/Reloading with PM2"

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              echo "App is already running. Reloading PM2 process..."

              pm2 reload "$APP_NAME"
            else
              echo "App is not running. Starting new PM2 process..."

              pm2 start dist/server.js --name "$APP_NAME"
            fi

            pm2 save

            echo "==> Backend deploy success without Nginx changes!"

            pm2 status
